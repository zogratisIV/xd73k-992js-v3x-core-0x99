name: Build Artix Runit v3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-artix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Artix with v3 Optimization
        run: |
          docker run --privileged --rm -v ${{ github.workspace }}:/workspace \
            archlinux:latest bash -c '
            set -e
            
            echo "=== Starting Artix v3 Build ===" >&2
            
            # (تحديث قاعدة البيانات الأولية)
            echo "[*] Initializing pacman keys..." >&2
            pacman-key --init
            pacman-key --populate archlinux
            pacman -Sy --noconfirm
            
            # (تثبيت أساسيات البناء والإنترنت)
            echo "[*] Installing base tools..." >&2
            pacman -S --noconfirm wget base-devel git
            
            # (إضافة مستودع Artix)
            echo "[*] Adding Artix repository..." >&2
            cat >> /etc/pacman.conf << EOF

[artix]
Server = https://mirror1.artixlinux.org/artix/\$repo/os/\$arch
Server = https://mirror2.artixlinux.org/artix/\$repo/os/\$arch
Server = https://mirror.pascalbrokmeier.de/artixlinux/\$repo/os/\$arch

[system]
Server = https://mirror1.artixlinux.org/artix/\$repo/os/\$arch

[world]
Server = https://mirror1.artixlinux.org/artix/\$repo/os/\$arch

[galaxy]
Server = https://mirror1.artixlinux.org/artix/\$repo/os/\$arch
EOF

            # (تحديث مفاتيح Artix)
            pacman -S --noconfirm artix-keyring artix-archlinux-support || true
            
            # (تحديث النظام الكامل)
            echo "[*] Updating full system..." >&2
            pacman -Syyu --noconfirm || true
            
            # (تثبيت runit و sysvcompat)
            echo "[*] Installing Artix Runit..." >&2
            pacman -S --noconfirm runit artix-sysvcompat || true
            
            # (إضافة تعليمات v3 في makepkg.conf)
            echo "[*] Configuring v3 optimization..." >&2
            sed -i "s/^CFLAGS=.*/CFLAGS=\"-march=x86-64-v3 -O3 -pipe\"/" /etc/makepkg.conf
            sed -i "s/^CXXFLAGS=.*/CXXFLAGS=\"\${CFLAGS}\"/" /etc/makepkg.conf
            sed -i "s/#MAKEFLAGS=.*/MAKEFLAGS=\"-j\$(nproc)\"/" /etc/makepkg.conf
            
            # (طباعة التعليمات للتحقق)
            echo "[*] Current makepkg.conf settings:" >&2
            grep -E "^(CFLAGS|CXXFLAGS|MAKEFLAGS)" /etc/makepkg.conf >&2
            
            # (إنشاء مجلد الإخراج وحفظ النتائج)
            mkdir -p /workspace/output
            
            # (احفظ التكوين)
            cp /etc/makepkg.conf /workspace/output/makepkg.conf
            cp /etc/pacman.conf /workspace/output/pacman.conf
            
            # (احفظ قائمة الحزم المثبتة)
            echo "[*] Saving package list..." >&2
            pacman -Q > /workspace/output/installed-packages.txt 2>&1 || echo "0 packages" > /workspace/output/installed-packages.txt
            
            # (احفظ معلومات النظام)
            uname -a > /workspace/output/system-info.txt
            cat /etc/os-release >> /workspace/output/system-info.txt 2>&1 || true
            
            # (احفظ سجل البناء)
            {
              echo "=== Artix Linux v3 Build Report ==="
              echo "Build Date: $(date)"
              echo "Kernel: $(uname -r)"
              echo "Arch: $(uname -m)"
              echo ""
              echo "=== Optimization Flags ==="
              echo "CFLAGS: -march=x86-64-v3 -O3 -pipe"
              echo "CXXFLAGS: \${CFLAGS}"
              echo "MAKEFLAGS: -j$(nproc)"
              echo ""
              echo "=== Package Count ==="
              wc -l /workspace/output/installed-packages.txt
              echo ""
              echo "Build Status: SUCCESS"
            } > /workspace/output/build-report.txt
            
            # (تصحيح الصلاحيات)
            chown -R $(id -u):$(id -g) /workspace/output 2>/dev/null || true
            chmod -R 755 /workspace/output
            
            echo "=== Build Complete ===" >&2
          '

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artix-runit-v3-build
          path: output/
          retention-days: 30

      - name: Show Build Summary
        run: |
          echo "=== Build Artifacts ==="
          if [ -d output ]; then
            ls -lah output/
            echo ""
            echo "=== Build Report ==="
            if [ -f output/build-report.txt ]; then
              cat output/build-report.txt
            fi
          else
            echo "No output directory found"
          fi
