name: Build Artix Linux ISO v3

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number'
        required: true
        default: '3.0.0'
      arch:
        description: 'Architecture'
        required: true
        type: choice
        options:
        - x86_64
        - aarch64
        default: 'x86_64'

env:
  IMAGE_NAME: artix-linux-v3
  BUILD_DIR: /tmp/artix-build

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: artixlinux/artixlinux:latest
      options: --privileged
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            archiso \
            git \
            wget \
            grub \
            syslinux \
            squashfs-tools \
            libisoburn \
            mtools \
            dosfstools \
            git

      - name: Create custom Artix profile
        run: |
          mkdir -p /tmp/artix-profile
          cp -r /usr/share/archiso/configs/releng/* /tmp/artix-profile/
          
          # تعديل الملفات حسب احتياجاتك v3
          cat > /tmp/artix-profile/packages.x86_64 << 'EOF'
          # Base packages
          base
          base-devel
          linux
          linux-firmware
          # Artix specific
          artix-mirrorlist
          openrc
          # Custom packages for v3
          vim
          nano
          networkmanager
          networkmanager-openrc
          openssh
          git
          wget
          curl
          # Your custom packages here
          EOF

          # تخصيص إعدادات النظام
          mkdir -p /tmp/artix-profile/airootfs/root
          cat > /tmp/artix-profile/airootfs/root/custom_setup.sh << 'EOF'
          #!/bin/bash
          echo "Artix Linux v3 Setup"
          # إعداداتك المخصصة هنا
          EOF
          chmod +x /tmp/artix-profile/airootfs/root/custom_setup.sh

      - name: Build ISO
        run: |
          cd /tmp/artix-profile
          mkarchiso -v -w /tmp/archiso-tmp -o /github/workspace/output .
          
      - name: Prepare ISO info
        id: iso_info
        run: |
          ISO_PATH=$(find /github/workspace/output -name "*.iso" | head -n 1)
          echo "iso_path=$ISO_PATH" >> $GITHUB_OUTPUT
          ISO_NAME=$(basename "$ISO_PATH")
          echo "iso_name=$ISO_NAME" >> $GITHUB_OUTPUT
          ISO_SIZE=$(du -h "$ISO_PATH" | cut -f1)
          echo "iso_size=$ISO_SIZE" >> $GITHUB_OUTPUT
          
          # Create checksums
          sha256sum "$ISO_PATH" > "${ISO_PATH}.sha256"
          md5sum "$ISO_PATH" > "${ISO_PATH}.md5"

      - name: Set version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=${{ github.event.inputs.version || '3.0.0-dev' }}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: "Artix Linux v${{ steps.version.outputs.version }}"
          tag_name: ${{ github.ref_name || steps.version.outputs.version }}
          body: |
            ## Artix Linux v${{ steps.version.outputs.version }}
            
            Build Date: ${{ github.event.repository.updated_at }}
            
            ### File Details:
            - **ISO**: ${{ steps.iso_info.outputs.iso_name }}
            - **Size**: ${{ steps.iso_info.outputs.iso_size }}
            - **Architecture**: ${{ github.event.inputs.arch || 'x86_64' }}
            
            ### Checksums:
            SHA256: See attached file
            MD5: See attached file
            
            ### Installation:
            1. Download the ISO
            2. Write to USB using `dd` or Etcher
            3. Boot and follow installation instructions
            
            Built using GitHub Actions
          files: |
            ${{ steps.iso_info.outputs.iso_path }}
            ${{ steps.iso_info.outputs.iso_path }}.sha256
            ${{ steps.iso_info.outputs.iso_path }}.md5
          generate_release_notes: true
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artix-iso-${{ steps.version.outputs.version }}
          path: |
            output/*.iso
            output/*.sha256
            output/*.md5
          retention-days: 30
