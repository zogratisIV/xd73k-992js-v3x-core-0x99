name: Build Artix Linux ISO v3

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number'
        required: true
        default: '3.0.0'

env:
  IMAGE_NAME: artix-linux-v3

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: artixlinux/artixlinux:latest
      options: --privileged
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup build environment for Artix
        run: |
          pacman -Syu --noconfirm
          # في Artix، الأدوات المطلوبة لبناء ISO
          pacman -S --noconfirm \
            git \
            wget \
            squashfs-tools \
            libisoburn \
            mtools \
            dosfstools \
            syslinux \
            grub \
            arch-install-scripts \
            pacman-contrib \
            base-devel

      - name: Download archiso from Arch repositories
        run: |
          # archiso غير متوفر في Artix، نحمله من Arch Linux repositories
          cd /tmp
          wget https://archlinux.org/packages/extra/any/archiso/download/ -O archiso.pkg.tar.zst
          pacman -U --noconfirm archiso.pkg.tar.zst || true
          
          # إذا فشل، نبني من AUR
          if [ ! -f /usr/bin/mkarchiso ]; then
            pacman -S --noconfirm --needed base-devel git
            useradd -m builder
            echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
            cd /tmp
            git clone https://aur.archlinux.org/archiso.git
            chown -R builder:builder archiso
            cd archiso
            su builder -c "makepkg -si --noconfirm"
          fi

      - name: Setup Artix ISO build profile
        run: |
          mkdir -p /tmp/artix-profile
          
          # استخدام basestrap بدلاً من pacstrap (Artix tool)
          cat > /tmp/artix-profile/packages.x86_64 << 'EOF'
          # Core Artix packages
          base
          base-devel
          openrc
          artix-mirrorlist
          
          # Kernel and firmware
          linux
          linux-firmware
          
          # System utilities
          grub
          efibootmgr
          networkmanager
          networkmanager-openrc
          elogind
          elogind-openrc
          
          # Custom packages for v3
          vim
          nano
          git
          wget
          curl
          openssh
          bash-completion
          sudo
          artools-base
          artools-iso
          EOF

      - name: Create custom configuration
        run: |
          # إنشاء مجلدات البناء
          mkdir -p /tmp/artix-profile/airootfs/etc
          mkdir -p /tmp/artix-profile/airootfs/root
          
          # إعدادات النظام المخصصة
          cat > /tmp/artix-profile/airootfs/root/artix-v3-setup.sh << 'V3EOF'
          #!/bin/bash
          set -e
          
          echo "Starting Artix Linux v3 customization..."
          
          # System configuration
          ln -sf /usr/share/zoneinfo/UTC /etc/localtime
          hwclock --systohc
          
          # Locale
          echo "en_US.UTF-8 UTF-8" > /etc/locale.gen
          locale-gen
          echo "LANG=en_US.UTF-8" > /etc/locale.conf
          
          # Hostname
          echo "artix-v3" > /etc/hostname
          
          # Enable services
          rc-update add NetworkManager default
          rc-update add elogind boot
          rc-update add sshd default
          
          # Root password (change this!)
          echo "root:artix" | chpasswd
          
          # Custom configurations
          echo "Welcome to Artix Linux v3" > /etc/motd
          
          touch /root/.artix-v3-setup-complete
          V3EOF
          
          chmod +x /tmp/artix-profile/airootfs/root/artix-v3-setup.sh
          
          # إضافة profile.ini
          cat > /tmp/artix-profile/profiledef.sh << 'PROFILEEOF'
          #!/usr/bin/env bash
          # shellcheck disable=SC2034
          
          iso_name="artix-v3"
          iso_label="ARTIX_V3_$(date +%Y%m)"
          iso_publisher="Artix Linux <https://artixlinux.org>"
          iso_application="Artix Linux Live/Rescue CD"
          iso_version="$(date +%Y.%m.%d)"
          install_dir="artix"
          buildmodes=('iso')
          bootmodes=('bios.syslinux.mbr' 'bios.syslinux.eltorito' 'uefi-x64.systemd-boot.esp' 'uefi-x64.systemd-boot.eltorito')
          arch="x86_64"
          pacman_conf="pacman.conf"
          airootfs_image_type="squashfs"
          airootfs_image_tool_options=('-comp' 'xz' '-Xbcj' 'x86' '-b' '1M' '-Xdict-size' '1M')
          file_permissions=(
            ["/etc/shadow"]="0:0:400"
            ["/root"]="0:0:750"
            ["/root/artix-v3-setup.sh"]="0:0:755"
          )
          PROFILEEOF
          
          chmod +x /tmp/artix-profile/profiledef.sh

      - name: Build the ISO
        run: |
          cd /tmp
          # استخدام mkarchiso لبناء الـ ISO
          mkarchiso -v -w /tmp/archiso-tmp -o $GITHUB_WORKSPACE/output /tmp/artix-profile

      - name: Verify ISO was created
        run: |
          echo "Checking for ISO files..."
          ls -lah $GITHUB_WORKSPACE/output/
          ISO_FILE=$(find $GITHUB_WORKSPACE/output -name "*.iso" -type f)
          if [ -z "$ISO_FILE" ]; then
            echo "Error: No ISO file found!"
            exit 1
          fi
          echo "ISO created successfully: $ISO_FILE"

      - name: Generate checksums
        run: |
          cd $GITHUB_WORKSPACE/output
          for iso in *.iso; do
            sha256sum "$iso" > "${iso}.sha256"
            md5sum "$iso" > "${iso}.md5"
          done

      - name: Upload ISO as artifact
        uses: actions/upload-artifact@v4
        with:
          name: artix-v3-iso-${{ github.run_number }}
          path: |
            output/*.iso
            output/*.sha256
            output/*.md5
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: "Artix Linux v3 - Build ${{ github.run_number }}"
          tag_name: ${{ github.ref_name || format('v{0}-build{1}', github.event.inputs.version || '3.0.0', github.run_number) }}
          body: |
            ## 🎯 Artix Linux v3 ISO
            
            **Build Details:**
            - 🏗️ Build Number: ${{ github.run_number }}
            - 📅 Build Date: ${{ github.event.repository.updated_at }}
            - 🔧 Architecture: x86_64
            - 🐧 Base: Artix Linux with OpenRC
            
            **Features:**
            - ✅ OpenRC init system
            - ✅ NetworkManager ready
            - ✅ SSH server enabled
            - ✅ Minimal base installation
            
            **Verification:**
            ```bash
            sha256sum -c *.iso.sha256
            md5sum -c *.iso.md5
