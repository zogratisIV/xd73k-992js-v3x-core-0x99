name: CI - linux-tkg build (Interactive Prompt)

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build Linux-TKG
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TKG_REPO: https://github.com/Frogging-Family/linux-tkg.git
      WORKDIR: ${{ github.workspace }}/tkg-build
      LOGFILE: ${{ github.workspace }}/tkg-build/build.log

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install APT dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang llvm lld build-essential git curl pkg-config libssl-dev bc ccache libelf-dev expect fakeroot dpkg-dev zstd libncurses-dev flex bison libudev-dev libpci-dev libiberty-dev

      - name: Prepare workspace & Clone linux-tkg
        run: |
          mkdir -p "$WORKDIR"
          git clone --depth 1 "$TKG_REPO" "$WORKDIR/linux-tkg"

      - name: Clean customization configs (Force Interactive Prompts)
        run: |
          cd "$WORKDIR/linux-tkg"
          rm -f customization.cfg

      - name: Inject Modules list for localmodconfig
        run: |
          cd "$WORKDIR/linux-tkg"
          if [ -f "${{ github.workspace }}/my_modules.txt" ]; then
            cp "${{ github.workspace }}/my_modules.txt" ./lsmod.txt
          fi

      - name: Run linux-tkg via Expect (Numbered Answers)
        run: |
          cd "$WORKDIR/linux-tkg"
          chmod +x install.sh
          
          expect -c '
            set timeout -1
            spawn ./install.sh install
            expect {
              "Which linux distribution" { send "5\r"; exp_continue }
              "Which kernel version" { send "1\r"; exp_continue }
              "Which CPU sched variant" { send "eevdf\r"; exp_continue }
              "Which compiler" { send "1\r"; exp_continue }
              "enable Clang Link Time Optimizations" { send "2\r"; exp_continue }
              "desired CPU micro-architecture" { send "x86-64-v3\r"; exp_continue }
              "kernel interrupt timer frequency" { send "5\r"; exp_continue }
              "Use CattaRappa mode" { send "2\r"; exp_continue }
              "Use ACS override patch" { send "n\r"; exp_continue }
              "Do you want to use make menuconfig" { send "0\r"; exp_continue }
              eof
            }
          ' > "$LOGFILE" 2>&1 || true

      - name: Upload Logs & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tkg-build-artifacts
          path: |
            ${{ env.LOGFILE }}
            ${{ github.workspace }}/tkg-build/linux-tkg/*.pkg.tar.zst
            ${{ github.workspace }}/tkg-build/linux-tkg/*.deb

      - name: Show tail of log
        if: always()
        run: |
          echo "=== Build log tail ==="
          tail -n 200 "$LOGFILE" || true
