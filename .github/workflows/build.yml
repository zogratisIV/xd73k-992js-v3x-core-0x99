name: Build Artix Runit v3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-artix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Artix
        run: |
          docker run --privileged --rm -v ${{ github.workspace }}:/workspace archlinux:latest bash -c '
            set -e
            
            echo "nameserver 8.8.8.8" > /etc/resolv.conf
            
            pacman -Sy --noconfirm
            pacman-key --init
            pacman-key --populate archlinux
            pacman -S --noconfirm wget sudo base-devel

            echo "CFLAGS=\"-march=x86-64-v3 -O3 -pipe -fno-plt -fexceptions\"" >> /etc/makepkg.conf
            echo "CXXFLAGS=\"\${CFLAGS}\"" >> /etc/makepkg.conf
            sed -i "s/#MAKEFLAGS=\"-j2\"/MAKEFLAGS=\"-j\$(nproc)\"/" /etc/makepkg.conf

            mkdir -p /etc/pacman.d
            echo "Server = https://mirror.artixlinux.org/\$repo/os/\$arch" > /etc/pacman.d/mirrorlist
            echo "Server = https://mirror.pascalbrokmeier.de/artixlinux/\$repo/os/\$arch" >> /etc/pacman.d/mirrorlist
            
            echo "" >> /etc/pacman.conf
            echo "[artix]" >> /etc/pacman.conf
            echo "SigLevel = PackageOptional" >> /etc/pacman.conf
            echo "Include = /etc/pacman.d/mirrorlist" >> /etc/pacman.conf
            
            echo "[system]" >> /etc/pacman.conf
            echo "Include = /etc/pacman.d/mirrorlist" >> /etc/pacman.conf
            
            echo "[world]" >> /etc/pacman.conf
            echo "Include = /etc/pacman.d/mirrorlist" >> /etc/pacman.conf
            
            echo "[galaxy]" >> /etc/pacman.conf
            echo "Include = /etc/pacman.d/mirrorlist" >> /etc/pacman.conf

            pacman -Syyu --noconfirm
            pacman -S --noconfirm artix-keyring artix-archlinux-support
            pacman -S --noconfirm runit artix-sysvcompat

            mkdir -p /workspace/output
            cp /etc/pacman.conf /workspace/output/
            cp -r /etc/pacman.d /workspace/output/
            chown -R 1001:1001 /workspace/output
          '

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artix-runit-v3-build
          path: output/
