name: Interactive SSH Terminal

on:
  workflow_dispatch:

jobs:
  ssh-session:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Setup Tmate SSH
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true # بيشغل الجلسة في الخلفية وطبع البيانات مباشرة

      - name: Keep Alive & Wait
        run: |
          echo "=========================================="
          echo "SSH Session Details:"
          cat /tmp/tmate.sock 2>/dev/null || true
          echo "=========================================="
          sleep 21600 # يفضل شغال 6 ساعات
