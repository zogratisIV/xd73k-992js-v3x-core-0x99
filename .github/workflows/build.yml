name: Build Artix Runit v3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-artix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Artix with v3 Optimization
        run: |
          docker run --privileged --rm -v ${{ github.workspace }}:/workspace \
            artixlinux/base:latest bash -c '
            set -e
            
            echo "=== Starting Artix v3 Build ===" >&2
            
            # (تحديث قائمة المرايا)
            pacman-key --init
            pacman-key --populate artix archlinux
            
            # (تحديث قاعدة البيانات والنظام)
            echo "[*] Updating system..." >&2
            pacman -Sy --noconfirm
            pacman -Syyu --noconfirm
            
            # (تثبيت الأدوات الأساسية للبناء)
            echo "[*] Installing build tools..." >&2
            pacman -S --noconfirm base-devel git devtools
            
            # (إضافة تعليمات v3 في makepkg.conf)
            echo "[*] Configuring v3 optimization..." >&2
            sed -i "s/^CFLAGS=.*/CFLAGS=\"-march=x86-64-v3 -O3 -pipe\"/" /etc/makepkg.conf
            sed -i "s/^CXXFLAGS=.*/CXXFLAGS=\"\${CFLAGS}\"/" /etc/makepkg.conf
            sed -i "s/#MAKEFLAGS=.*/MAKEFLAGS=\"-j\$(nproc)\"/" /etc/makepkg.conf
            
            # (طباعة التعليمات للتحقق)
            echo "[*] Current makepkg.conf:" >&2
            grep -E "^(CFLAGS|CXXFLAGS|MAKEFLAGS)" /etc/makepkg.conf >&2
            
            # (إنشاء مجلد الإخراج وحفظ النتائج)
            mkdir -p /workspace/output
            
            # (احفظ التكوين)
            cp /etc/makepkg.conf /workspace/output/
            
            # (احفظ قائمة الحزم المثبتة)
            pacman -Q > /workspace/output/installed-packages.txt
            
            # (احفظ معلومات النظام)
            uname -a > /workspace/output/system-info.txt
            cat /etc/os-release >> /workspace/output/system-info.txt
            
            # (احفظ سجل البناء)
            echo "Artix Linux v3 Build Completed" > /workspace/output/build-log.txt
            echo "Date: $(date)" >> /workspace/output/build-log.txt
            echo "CFLAGS: -march=x86-64-v3 -O3 -pipe" >> /workspace/output/build-log.txt
            
            # (تصحيح الصلاحيات)
            chown -R $(id -u):$(id -g) /workspace/output
            
            echo "=== Build Complete ===" >&2
          '

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artix-runit-v3-build
          path: output/
          retention-days: 30

      - name: Show Build Summary
        run: |
          echo "=== Build Summary ==="
          echo "Output files:"
          ls -lah output/
          echo ""
          echo "Installed packages count:"
          wc -l output/installed-packages.txt
          echo ""
          echo "System info:"
          cat output/system-info.txt
