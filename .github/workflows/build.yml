name: Interactive SSH Terminal

on:
  workflow_dispatch: # ده بيخليك تشغل الـ Action يدويًا بضغطة زرار من موقع جيت هب

jobs:
  ssh-session:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Start SSH Session via Tmate
        uses: mxschmitt/action-tmate@v3
        with:
          detached: false # عشان يفضل السيرفر مستنيك وما يقفلش لغاية ما تخلص بنفسك
